<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日小說 | 施坤政 Digital Garden</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --border-color: #2c2c32;
            --text-main: #e6e6e8;
            --text-muted: #8e8e93;
            --accent-beige: #d8c8b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-link:hover { color: var(--accent-beige); }

        .page-title { font-size: 1.5rem; font-weight: 700; }

        .novel-list { display: flex; flex-direction: column; gap: 24px; }

        .novel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 32px;
            transition: border-color 0.2s;
        }

        .novel-card:hover { border-color: var(--accent-beige); }

        .card-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--bg-dark);
            background: var(--accent-beige);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .novel-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }

        .novel-intro p { margin-bottom: 12px; color: var(--text-main); opacity: 0.9; }

        .novel-meta {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--accent-beige);
            padding: 12px 16px;
            margin: 24px 0;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-primary {
            display: inline-block;
            background: var(--accent-beige);
            color: var(--bg-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
            <a href="index.html" class="back-link">← 返回總展覽館</a>
            <h1 class="page-title">02 / 末日小說</h1>
        </header>

        <section id="novel-container" class="novel-list">
            <p style="color: var(--text-muted);">正在載入小說作品...</p>
        </section>
    </main>

    <script>
        fetch('novels.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('novel-container');
                container.innerHTML = '';

                data.forEach(item => {
                    const cardHtml = `
                        <article class="novel-card">
                            <span class="card-badge">${item.badge}</span>
                            <h2 class="novel-title">${item.title}</h2>
                            <div class="novel-intro">
                                <p>${item.intro1}</p>
                                ${item.intro2 ? `<p>${item.intro2}</p>` : ''}
                            </div>
                            <div class="novel-meta">
                                <div><strong>風格調性：</strong>${item.style}</div>
                                <div style="margin-top: 4px;"><strong>登場角色：</strong>${item.characters}</div>
                            </div>
                            ${item.url ? `
                                <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="btn-primary">
                                    ${item.btn_text || '前往連載頁面 ➔'}
                                </a>
                            ` : ''}
                        </article>
                    `;
                    container.innerHTML += cardHtml;
                });
            })
            .catch(err => {
                document.getElementById('novel-container').innerHTML = 
                    '<p style="color:#ff6b6b;">無法載入 novels.json。</p>';
            });
    </script>

</body>
</html>
