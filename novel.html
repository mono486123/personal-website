<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>末日小說 | 施坤政 Digital Garden</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --border-color: #2c2c32;
            --text-main: #e6e6e8;
            --text-muted: #8e8e93;
            --accent-beige: #d8c8b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-link:hover { color: var(--accent-beige); }

        .page-title { font-size: 1.5rem; font-weight: 700; }

        .novel-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 32px;
        }

        .card-badge {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--bg-dark);
            background: var(--accent-beige);
            padding: 4px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 12px;
        }

        .novel-title { font-size: 1.5rem; font-weight: 700; margin-bottom: 16px; }

        .novel-intro p { margin-bottom: 12px; color: var(--text-main); opacity: 0.9; }

        .novel-meta {
            background: rgba(0, 0, 0, 0.25);
            border-left: 3px solid var(--accent-beige);
            padding: 12px 16px;
            margin: 24px 0;
            border-radius: 4px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .btn-primary {
            display: inline-block;
            background: var(--accent-beige);
            color: var(--bg-dark);
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 6px;
            text-decoration: none;
            transition: opacity 0.2s;
        }

        .btn-primary:hover { opacity: 0.9; }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
            <a href="index.html" class="back-link">← 返回總展覽館</a>
            <h1 class="page-title">02 / 末日小說</h1>
        </header>

        <article class="novel-card">
            <span class="card-badge">十萬字連載中</span>
            <h2 class="novel-title">末日長篇小說《無限殺戮》</h2>
            
            <div class="novel-intro">
                <p>當舊世界的道德秩序崩解，生存不再是一場高尚的道德競賽，而是理智與野性碰撞的極限演繹。</p>
                <p>作品融合荒誕寫實風格與深刻的人性拉扯，深刻剖析在絕境體制下，個人意志的抉擇、背叛與自我救贖。</p>
            </div>

            <div class="novel-meta">
                <div><strong>風格調性：</strong>荒誕寫實 / 人性拉扯 / 黑色幽默</div>
                <div style="margin-top: 4px;"><strong>登場角色：</strong>森元、夕中、卡西烏斯</div>
            </div>

            <a href="https://home.gamer.com.tw/" target="_blank" rel="noopener noreferrer" class="btn-primary">
                前往巴哈姆特小屋閱讀連載 ➔
            </a>
        </article>
    </main>

</body>
</html>
