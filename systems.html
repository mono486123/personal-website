<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>技術實作 | 施坤政 Digital Garden</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --border-color: #2c2c32;
            --text-main: #e6e6e8;
            --text-muted: #8e8e93;
            --accent-beige: #d8c8b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        /* 頂部導覽 */
        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 32px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .back-link:hover { color: var(--accent-beige); }

        .page-title { font-size: 1.5rem; font-weight: 700; }

        /* 橫向列表區 */
        .horizontal-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 24px;
            transition: border-color 0.2s, transform 0.2s;
        }

        .card:hover {
            border-color: var(--accent-beige);
            transform: translateY(-2px);
        }

        .card-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--accent-beige);
            background: rgba(216, 200, 184, 0.12);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 8px;
        }

        .card-desc {
            font-size: 0.92rem;
            color: var(--text-muted);
            margin-bottom: 16px;
            line-height: 1.6;
        }

        .card-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }

        .tag {
            font-size: 0.75rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--border-color);
            padding: 3px 8px;
            border-radius: 4px;
        }

        /* 實作連結按鈕區 */
        .card-links {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            padding-top: 12px;
            border-top: 1px dashed var(--border-color);
        }

        .link-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 0.82rem;
            color: var(--accent-beige);
            text-decoration: none;
            background: rgba(216, 200, 184, 0.08);
            border: 1px solid rgba(216, 200, 184, 0.2);
            padding: 5px 12px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .link-btn:hover {
            background: var(--accent-beige);
            color: var(--bg-dark);
            font-weight: 600;
        }
    </style>
</head>
<body>

    <main class="container">
        <header class="header-nav">
            <a href="index.html" class="back-link">← 返回總展覽館</a>
            <h1 class="page-title">01 / 技術實作</h1>
        </header>

        <!-- JSON 資料動態渲染目標區 -->
        <section id="systems-container" class="horizontal-list">
            <p style="color: var(--text-muted);">正在載入專案資料...</p>
        </section>
    </main>

    <script>
        // 自動載入 systems.json 檔案
        fetch('systems.json')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('systems-container');
                container.innerHTML = ''; // 清空載入中提示

                data.forEach(item => {
                    const tagsHtml = item.tags.map(t => `<span class="tag">${t}</span>`).join('');
                    
                    let linksHtml = '';
                    if (item.links && item.links.length > 0) {
                        linksHtml = `
                            <div class="card-links">
                                ${item.links.map(l => `<a href="${l.url}" target="_blank" class="link-btn">${l.name} ➔</a>`).join('')}
                            </div>
                        `;
                    }

                    const cardHtml = `
                        <article class="card">
                            <span class="card-badge">${item.badge}</span>
                            <h2 class="card-title">${item.title}</h2>
                            <p class="card-desc">${item.description}</p>
                            <div class="card-tags">${tagsHtml}</div>
                            ${linksHtml}
                        </article>
                    `;
                    container.innerHTML += cardHtml;
                });
            })
            .catch(err => {
                document.getElementById('systems-container').innerHTML = 
                    '<p style="color:#ff6b6b;">無法載入 systems.json，請確認檔案是否存在。</p>';
            });
    </script>
</body>
</html>
