<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>生活與節奏 | 施坤政 Digital Garden</title>
    <style>
        :root {
            --bg-dark: #121214;
            --bg-card: #1a1a1e;
            --border-color: #2c2c32;
            --text-main: #e6e6e8;
            --text-muted: #8e8e93;
            --accent-beige: #d8c8b8;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container { max-width: 800px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .back-link {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
        }

        .back-link:hover { color: var(--accent-beige); }

        .page-title { font-size: 1.5rem; font-weight: 700; }

        .filter-bar {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }

        .tag-btn {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            font-size: 0.85rem;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .tag-btn.active {
            background: var(--accent-beige);
            color: var(--bg-dark);
            border-color: var(--accent-beige);
            font-weight: 600;
        }

        .timeline-list { display: flex; flex-direction: column; gap: 16px; }

        .timeline-item {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            display: flex;
            gap: 20px;
            transition: border-color 0.2s;
        }

        .timeline-item:hover { border-color: var(--accent-beige); }

        .timeline-item.hidden { display: none; }

        .timeline-date {
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--accent-beige);
            min-width: 70px;
        }

        .timeline-title { font-size: 1.05rem; font-weight: 600; margin-bottom: 6px; }

        .timeline-desc { font-size: 0.9rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <main class="container">
        <header class="header">
            <a href="index.html" class="back-link">← 返回總展覽館</a>
            <h1 class="page-title">03 / 生活與節奏</h1>
        </header>

        <div class="filter-bar" id="filter-bar">
            <button class="tag-btn active" data-filter="all">#全選</button>
            <button class="tag-btn" data-filter="台11線">#台11線</button>
            <button class="tag-btn" data-filter="吉他">#吉他</button>
            <button class="tag-btn" data-filter="UCC咖啡">#UCC咖啡</button>
            <button class="tag-btn" data-filter="動漫觀點">#動漫觀點</button>
        </div>

        <div id="timeline-container" class="timeline-list">
            <p style="color: var(--text-muted);">正在載入生活紀錄...</p>
        </div>
    </main>

    <script>
        fetch('micro_logs.json?v=' + new Date().getTime())
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('timeline-container');
                container.innerHTML = '';

                data.forEach(item => {
                    const itemHtml = `
                        <article class="timeline-item" data-category="${item.category}">
                            <div class="timeline-date">${item.date}</div>
                            <div>
                                <h3 class="timeline-title">${item.title}</h3>
                                <p class="timeline-desc">${item.desc}</p>
                            </div>
                        </article>
                    `;
                    container.innerHTML += itemHtml;
                });

                // 註冊篩選按鈕事件
                initFilter();
            })
            .catch(err => {
                document.getElementById('timeline-container').innerHTML = 
                    '<p style="color:#ff6b6b;">無法載入 micro_logs.json。</p>';
            });

        function initFilter() {
            const filterBtns = document.querySelectorAll('.tag-btn');
            const items = document.querySelectorAll('.timeline-item');

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const category = btn.getAttribute('data-filter');
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');

                    items.forEach(item => {
                        if (category === 'all' || item.getAttribute('data-category') === category) {
                            item.classList.remove('hidden');
                        } else {
                            item.classList.add('hidden');
                        }
                    });
                });
            });
        }
    </script>

</body>
</html>
